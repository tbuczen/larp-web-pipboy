<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>PipBoy</title>
  <defs>
    <radialGradient id="screen" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#0b3d14"/>
      <stop offset="1" stop-color="#031406"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".35"/>
    </pattern>
  </defs>
  <!-- Screen with a phosphor bezel -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#screen)" stroke="#1cfa80" stroke-width="4"/>
  <!-- Pixel "P" on a 6px grid -->
  <g fill="#1cfa80">
    <rect x="13" y="12" width="6" height="40"/>
    <rect x="19" y="12" width="15" height="6"/>
    <rect x="34" y="18" width="6" height="10"/>
    <rect x="19" y="28" width="15" height="6"/>
  </g>
  <!-- Terminal cursor block -->
  <rect x="44" y="40" width="8" height="12" fill="#1cfa80"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#scan)"/>
</svg>
