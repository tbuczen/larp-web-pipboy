framework:
    assets:
        # Versioned URLs bust the host's week-long static file cache after each deploy.
        version_strategy: App\Asset\FileModifiedVersionStrategy
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    session:
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true
    router:
        utf8: true
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 100
            interval: '1 hour'
        invitation_accept:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # Starting chats is limited so PipBoy numbers cannot be probed by guessing.
        chat_request:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        chat_send:
            policy: sliding_window
            limit: 30
            interval: '1 minute'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.native
