framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    session:
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true
    router:
        utf8: true
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 100
            interval: '1 hour'
        invitation_accept:
            policy: sliding_window
            limit: 30
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.native
